services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vrize-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vrize_agentic_support
      POSTGRES_USER: vrize
      POSTGRES_PASSWORD: vrize_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: